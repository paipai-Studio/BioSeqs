name: CI

on:
  push:
    branches: [main, master, dev, dev1102]
  pull_request:
    branches: [main, master, dev]

jobs:
  # 目标无关的基础检查：格式、类型检查、README 计数
  check:
    name: Check (fmt, typecheck, README counts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Check MoonBit version
        run: moon version --all

      - name: Moon fmt check
        run: moon fmt --check

      - name: README counts check
        run: python3 scripts/check_readme_counts.py

      - name: Moon check
        run: moon check

  # 多目标后端矩阵：构建全部后端，测试全部后端
  build-test:
    name: Build & Test (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # wasm-gc / native / js：默认模式即可构建与测试
        # wasm：需 --release 优化以缩减 moonbit__init 函数的 local 数量，
        #       并配合 ulimit -s unlimited 规避 link-core 阶段的栈溢出
        target: [wasm-gc, wasm, native, js]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Check MoonBit version
        run: moon version --all

      - name: Moon build (${{ matrix.target }})
        run: moon build --target ${{ matrix.target }}

      - name: Moon test (${{ matrix.target }})
        run: |
          ulimit -s unlimited
          moon test --target ${{ matrix.target }} ${{ matrix.target == 'wasm' && '--release' || '' }}
