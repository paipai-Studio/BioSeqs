name: CI

on:
  push:
    branches: [main, master, dev, dev1102]
  pull_request:
    branches: [main, master, dev]

jobs:
  check-build-test:
    name: Check, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Check MoonBit version
        run: moon version

      - name: Moon fmt check
        run: moon fmt --check

      - name: README counts check
        run: python3 scripts/check_readme_counts.py

      - name: Moon check
        run: moon check

      - name: Moon build (src lib)
        run: moon build --package IvanAXu/BioSeqs/src

      - name: Moon test
        run: moon test --package IvanAXu/BioSeqs/test/moonbit
